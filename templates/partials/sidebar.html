<div class="sidebar">

    <div class="sidebar-logo">

        <div class="logo-box" style="background: #0f3c68; color: #ffffff; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
            <i class="bi bi-file-earmark-lock2"></i>
        </div>

        <div>
            <h5 class="mb-0 fw-bold" style="color: #0f3c68; font-size: 1.05rem; letter-spacing: -0.02em;">JAWA SATU POWER</h5>
            <small class="text-muted fw-semibold" style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;">PLTGU Jawa-1 • DMS OCR</small>
        </div>

    </div>

    <ul class="sidebar-menu">

        <li>
            <a href="{{ url_for('dashboard.index') }}"
            class="{% if request.endpoint == 'dashboard.index' %}active{% endif %}">

                <i class="bi bi-speedometer2"></i>
                <span>Status & Kontrol</span>

            </a>
        </li>

        <li>
            <a href="{{ url_for('dashboard.documents') }}"
            class="{% if request.endpoint == 'dashboard.documents' %}active{% endif %}">

                <i class="bi bi-folder2-open"></i>
                <span>Arsip Dokumen</span>

            </a>
        </li>

        <li>
            <a href="{{ url_for('dashboard.monitoring') }}"
            class="{% if request.endpoint == 'dashboard.monitoring' %}active{% endif %}">

                <i class="bi bi-activity"></i>
                <span>Pemantauan Antrean</span>

            </a>
        </li>

        <li>
            <a href="{{ url_for('dashboard.analytics') }}"
            class="{% if request.endpoint == 'dashboard.analytics' %}active{% endif %}">

                <i class="bi bi-bar-chart-line"></i>
                <span>Statistik Operasi</span>

            </a>
        </li>

        <li>
            <a href="{{ url_for('dashboard.settings') }}"
            class="{% if request.endpoint == 'dashboard.settings' %}active{% endif %}">

                <i class="bi bi-sliders2"></i>
                <span>Konfigurasi Sistem</span>

            </a>
        </li>

        {% if current_user and current_user.is_authenticated and current_user.is_operator %}
        <li>
            <a href="{{ url_for('auth.users_list') }}"
            class="{% if request.endpoint == 'auth.users_list' %}active{% endif %}">

                <i class="bi bi-person-badge"></i>
                <span>Otorisasi Petugas</span>

            </a>
        </li>
        {% endif %}

    </ul>

</div>
