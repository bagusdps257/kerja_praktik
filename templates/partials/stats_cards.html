<div class="row g-3 mb-4">

    <!-- Card 1: Total Input Files (Amber / Yellow) -->
    <div class="col-md-6 col-xl-3">
        <div class="analytics-card h-100 analytics-card-hover">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="analytics-card-label">Total Input Files</div>
                    <div class="analytics-card-value" style="color: #d97706;" id="stat-total-input">
                        {{ stats.total_input }}
                    </div>
                </div>

                <div class="analytics-card-icon analytics-icon-amber">
                    <i class="bi bi-folder2-open"></i>
                </div>
            </div>

            <div class="analytics-card-footer">
                <i class="bi bi-file-earmark-pdf me-1" style="color: #d97706;"></i>
                <span class="text-muted">Files in input directory</span>
            </div>
        </div>
    </div>

    <!-- Card 2: Successfully Processed (Success / Green) -->
    <div class="col-md-6 col-xl-3">
        <div class="analytics-card h-100 analytics-card-hover">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="analytics-card-label">Successfully Processed</div>
                    <div class="analytics-card-value analytics-value-success" id="stat-success">
                        {{ stats.total_output }}
                    </div>
                </div>

                <div class="analytics-card-icon analytics-icon-green">
                    <i class="bi bi-check-circle"></i>
                </div>
            </div>

            <div class="analytics-card-footer">
                <i class="bi bi-check-circle-fill me-1 text-success"></i>
                <span class="text-muted">Completed conversions</span>
            </div>
        </div>
    </div>

    <!-- Card 3: Failed Documents (Danger / Red) -->
    <div class="col-md-6 col-xl-3">
        <div class="analytics-card h-100 analytics-card-hover">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="analytics-card-label">Failed Documents</div>
                    <div class="analytics-card-value text-danger" id="stat-failed">
                        {{ stats.total_gagal }}
                    </div>
                </div>

                <div class="analytics-card-icon analytics-mini-icon-red">
                    <i class="bi bi-exclamation-octagon"></i>
                </div>
            </div>

            <div class="analytics-card-footer">
                <i class="bi bi-exclamation-triangle-fill me-1 text-danger"></i>
                <span class="text-muted">Requires manual review</span>
            </div>
        </div>
    </div>

    <!-- Card 4: Waiting Queue (Indigo / Blue) -->
    <div class="col-md-6 col-xl-3">
        <div class="analytics-card h-100 analytics-card-hover">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="analytics-card-label">Waiting Queue</div>
                    <div class="analytics-card-value analytics-value-purple" id="stat-pending">
                        {{ stats.pending }}
                    </div>
                </div>

                <div class="analytics-card-icon analytics-icon-indigo">
                    <i class="bi bi-hourglass-split"></i>
                </div>
            </div>

            <div class="analytics-card-footer">
                <i class="bi bi-circle-fill me-1" style="color:#6366f1; font-size:6px; vertical-align:middle;"></i>
                <span class="text-muted">Processing queue active</span>
            </div>
        </div>
    </div>

</div>
