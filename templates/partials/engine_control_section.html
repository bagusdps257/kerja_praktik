<div class="analytics-card p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h5 class="analytics-section-title mb-0">
            <i class="bi bi-sliders2 me-2" style="color:#0f3c68;"></i>
            Panel Eksekusi Konversi OCR
        </h5>

    </div>

    <form id="form-folder" action="/update_folder" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="mb-3">

            <label class="form-label small text-uppercase text-muted fw-bold mb-1" style="letter-spacing:.04em; font-size:.76rem;">
                Direktori Berkas Masuk (Input)
            </label>

            <div class="input-group path-input-group">

                <span class="input-group-text">
                    <i class="bi bi-folder2-open"></i>
                </span>

                <input type="text"
                       id="input_dir"
                       name="input_dir"
                       class="form-control"
                       value="{{ stats.input_dir }}"
                       required>

                <button class="btn btn-sm btn-white border shadow-sm text-secondary rounded-2 px-3 my-1 ms-1 d-flex align-items-center gap-1"
                        type="button"
                        onclick="pilihFolder('input_dir')">
                    <i class="bi bi-folder2-open text-primary"></i>
                    <span>Cari</span>
                </button>

            </div>
            <div id="input-dir-status" class="mt-1"></div>

        </div>

        <div class="mb-4">

            <label class="form-label small text-uppercase text-muted fw-bold mb-1" style="letter-spacing:.04em; font-size:.76rem;">
                Direktori Berkas Arsip (Output Searchable PDF)
            </label>

            <div class="input-group path-input-group">

                <span class="input-group-text">
                    <i class="bi bi-folder-check"></i>
                </span>

                <input type="text"
                       id="output_dir"
                       name="output_dir"
                       class="form-control"
                       value="{{ stats.output_dir }}"
                       required>

                <button class="btn btn-sm btn-white border shadow-sm text-secondary rounded-2 px-3 my-1 ms-1 d-flex align-items-center gap-1"
                        type="button"
                        onclick="pilihFolder('output_dir')">
                    <i class="bi bi-folder-check text-success"></i>
                    <span>Cari</span>
                </button>

            </div>
            <div id="output-dir-status" class="mt-1"></div>

        </div>

    </form>

    <hr class="analytics-divider my-4">

    <!-- Execution Form with Subfolder Target Scope -->
    <form action="/jalankan" method="POST" id="form-jalankan" class="mb-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <!-- Target Subfolder Selector -->
        <div class="mb-3 p-3 rounded-2 border" style="background: #f8fafc;">
            <label class="form-label small text-uppercase text-muted fw-bold mb-1.5 d-flex align-items-center justify-content-between" style="letter-spacing:.04em; font-size:.74rem;">
                <span><i class="bi bi-diagram-3 me-1.5" style="color: #0f3c68;"></i>Cakupan Pemrosesan (Target Subfolder)</span>
                <span id="target-scope-badge" class="badge border px-2 py-0.5 rounded-1 text-muted fw-normal" style="background:#ffffff; font-size: 0.7rem;">Semua Subfolder</span>
            </label>
            <div class="input-group">
                <span class="input-group-text bg-white">
                    <i class="bi bi-folder2 text-secondary"></i>
                </span>
                <select class="form-select" id="target_subfolder" name="target_subfolder">
                    <option value="">Seluruh Direktori Input (Semua Subfolder) — Default</option>
                </select>
                <button class="btn btn-sm btn-white border shadow-sm text-secondary rounded-2 px-3 my-1 ms-1 d-flex align-items-center gap-1"
                        type="button"
                        id="btn-scan-subfolders"
                        onclick="muatDaftarSubfolder()"
                        title="Pindai ulang daftar subfolder">
                    <i class="bi bi-arrow-clockwise text-primary"></i>
                    <span>Pindai Ulang</span>
                </button>
            </div>
            <div id="target-scope-desc" class="form-text small text-muted mt-1.5" style="font-size: 0.74rem;">
                Sistem memindai <strong>seluruh subfolder</strong> di dalam direktori input secara komprehensif.
            </div>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4 py-2.5 rounded-2 d-flex align-items-center fw-semibold">
                    <i class="bi bi-play-circle-fill me-2 fs-5"></i>
                    <span>Mulai Pemrosesan Berkas</span>
                </button>
                <button type="button"
                        id="btn-stop"
                        class="btn btn-danger px-4 py-2.5 rounded-2 d-flex align-items-center fw-semibold"
                        data-bs-toggle="modal" data-bs-target="#stopProcessModal">
                    <i class="bi bi-stop-circle-fill me-2 fs-5"></i>
                    <span>Hentikan Proses</span>
                </button>
            </div>

            <div class="text-md-end bg-light p-2.5 px-3 rounded-2 border">
                <div class="small text-muted fw-bold text-uppercase mb-0.5" style="font-size:.68rem; letter-spacing:.05em;">
                    Berkas Aktif Diproses
                </div>
                <div id="progress-file"
                     class="fw-bold text-truncate"
                     style="max-width: 240px; color:#0f3c68; font-size:.88rem;">
                    -
                </div>
            </div>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-2">

        <span class="fw-semibold text-muted small">
            Progres Pemrosesan
        </span>

        <span id="progress-persen"
              class="fw-bold"
              style="color:#0f3c68;">
            0%
        </span>

    </div>

    <div class="progress analytics-progress mb-3">

        <div id="progress-bar"
             class="progress-bar progress-bar-striped progress-bar-animated analytics-progress-bar-gradient"
             style="width:0%">
            0%
        </div>

    </div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

        <div id="progress-status"
             class="small text-muted">
            Status :
            <span class="badge badge-soft-secondary px-3 py-1.5 rounded-pill fw-bold">IDLE</span>
        </div>

        <div class="small text-muted fw-medium">
            <span id="progress-selesai" class="fw-bold text-dark">0</span>
            /
            <span id="progress-total" class="fw-bold text-dark">0</span>
            file
        </div>

    </div>

</div>

<!-- Stop Process Confirmation Modal -->
<div class="modal fade" id="stopProcessModal" tabindex="-1" aria-labelledby="stopProcessModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">
            <div class="modal-body text-center p-4">
                <div class="d-flex align-items-center justify-content-center mx-auto mb-3"
                     style="width: 56px; height: 56px; border-radius: 50%; background: #fee2e2;">
                    <i class="bi bi-stop-circle-fill fs-4" style="color: #e11d48;"></i>
                </div>
                <h5 class="fw-bold mb-2">Hentikan Proses OCR?</h5>
                <p class="text-muted small mb-4">
                    Proses OCR akan dihentikan setelah file yang sedang aktif selesai diproses.
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <button type="button" class="btn btn-light px-4 rounded-pill fw-semibold" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-gradient-destructive px-4 rounded-pill fw-semibold" id="btn-confirm-stop">
                        <i class="bi bi-stop-circle me-1"></i>Hentikan Proses
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Folder Explorer Modal -->
<div class="modal fade" id="folderExplorerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Pilih Folder</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="input-group mb-3">
                    <button class="btn btn-outline-secondary" type="button" id="explorerBtnUp"><i class="bi bi-arrow-up"></i> Naik</button>
                    <input type="text" class="form-control" id="explorerCurrentPath" readonly>
                </div>
                <div class="list-group" id="explorerFolderList" style="max-height: 400px; overflow-y: auto;">
                    <!-- Folders injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-primary" id="explorerBtnSelect">Pilih Folder Ini</button>
            </div>
        </div>
    </div>
</div>
